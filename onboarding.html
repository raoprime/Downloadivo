<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Downloadivo — Studio Onboarding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background-color: #060608;
      color: #f4f4f5;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .mobile-frame {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 890px;
      background: #060608;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 20px 24px 20px;
      overflow: hidden;
    }
    @media (min-width: 640px) {
      .mobile-frame {
        height: 844px;
        border-radius: 40px;
        border: 8px solid #141418;
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9);
      }
    }
  </style>
</head>
<body>
  <div id="root" class="mobile-frame"></div>

  <script type="text/babel">
    const { useState } = React;

    // Platform badges data
    const platforms = [
      { name: "YouTube", tag: "4K / 8K • Shorts", badge: "YT", color: "#FF0000" },
      { name: "Instagram", tag: "Reels • Stories", badge: "IG", color: "#E1306C" },
      { name: "TikTok", tag: "No Watermark", badge: "TT", color: "#00F2FE" },
      { name: "X / Twitter", tag: "Videos • GIFs", badge: "X", color: "#FFFFFF" },
      { name: "Spotify", tag: "320kbps MP3", badge: "SP", color: "#1DB954" },
      { name: "Reddit", tag: "Audio+Video", badge: "RD", color: "#FF4500" },
      { name: "Facebook", tag: "Watch • HD", badge: "FB", color: "#1877F2" },
      { name: "1,000+ More", tag: "Universal Engine", badge: "ALL", color: "#10B981" }
    ];

    const slide1Features = [
      { title: "100% Free", sub: "No Paywalls", icon: "M12 12c-2-2.67-4-4-6-4a4 4 0 1 0 0 8c2 0 4-1.33 6-4Zm0 0c2 2.67 4 4 6 4a4 4 0 0 0 0-8c-2 0-4 1.33-6 4Z" },
      { title: "0 Watermarks", sub: "Pure Original", icon: "M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" },
      { title: "100% Private", sub: "Device Direct", icon: "M7 11V7a5 5 0 0 1 10 0v4 M3 11h18v11H3z" },
      { title: "Turbo Speed", sub: "16-Channel Engine", icon: "M13 2 3 14h9l-1 8 10-12h-9l1-8z" }
    ];

    const slide3Features = [
      { title: "16 Parallel Stream Connections", sub: "Maximizes line bandwidth and eliminates socket timeouts", icon: "M13 2 3 14h9l-1 8 10-12h-9l1-8z" },
      { title: "HTTP Range Auto-Resume", sub: "Dropout reconnection continues exactly where it left off", icon: "M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8 M3 3v5h5 M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16 M16 21h5v-5" },
      { title: "Lossless FFmpeg Merging", sub: "Combines 4K/8K video and audio into universal MP4 container", icon: "M12 2v20 M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" }
    ];

    const slide4Features = [
      { title: "Instant Ad-Free Stream", sub: "Zero-buffering playback with floating background PiP", icon: "M5 3l14 9-14 9V3z" },
      { title: "320kbps Studio Audio Extractor", sub: "Convert any music video to high-fidelity lossless MP3", icon: "M9 18V5l12-2v13 M6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M18 19a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" },
      { title: "Precision Clip Trimmer", sub: "Trim and save custom seconds directly into device storage", icon: "M6 6a3 3 0 1 0 0 6 3 3 0 0 0 0-6z M18 12a3 3 0 1 0 0 6 3 3 0 0 0 0-6z M8.59 13.51l6.83 3.98 M15.41 6.51l-6.82 3.98" }
    ];

    function OnboardingApp() {
      const [step, setStep] = useState(1);

      return (
        <div className="relative h-full flex flex-col justify-between">
          {/* Subtle Ambient Background Mesh */}
          <div className="pointer-events-none absolute top-12 left-1/2 -translate-x-1/2 w-64 h-64 rounded-full bg-cyan-500/10 blur-[90px]" />
          <div className="pointer-events-none absolute bottom-24 left-1/2 -translate-x-1/2 w-64 h-64 rounded-full bg-violet-500/10 blur-[100px]" />

          {/* Top Header Bar */}
          <header className="relative z-10 flex items-center justify-between pb-2">
            <img src="/assets/app_logo_white.png" alt="Downloadivo" className="h-6 w-auto object-contain" />
            <div className="flex items-center gap-3">
              <span className="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-white/[0.06] border border-white/[0.08] text-zinc-300 tabular-nums">
                {step} / 4
              </span>
              <button 
                onClick={() => window.location.href = "/"}
                className="text-xs font-medium text-zinc-400 hover:text-white transition cursor-pointer"
              >
                Skip
              </button>
            </div>
          </header>

          {/* Central Slide Content Container */}
          <div className="relative z-10 flex-1 flex flex-col justify-center py-2 overflow-hidden">
            {/* ── SLIDE 1: Hero & 3D Media Core ── */}
            {step === 1 && (
              <div className="flex flex-col items-center text-center animate-fadeIn">
                <div className="relative w-44 h-44 sm:w-48 sm:h-48 flex items-center justify-center mb-3">
                  <div className="absolute inset-2 rounded-full bg-cyan-500/15 blur-[40px] pointer-events-none" />
                  <video
                    autoPlay
                    loop
                    muted
                    playsInline
                    poster="/assets/intro_3d_render.jpg"
                    className="w-full h-full object-contain rounded-2xl drop-shadow-[0_15px_30px_rgba(0,0,0,0.8)] filter contrast-[1.03]"
                  >
                    <source src="/assets/intro_3d.mp4" type="video/mp4" />
                    <img src="/assets/intro_3d_render.jpg" alt="Downloadivo 3D Media Core" className="w-full h-full object-contain rounded-2xl" />
                  </video>
                </div>

                <h1 className="text-xl sm:text-2xl font-bold tracking-tight text-white">
                  The Next-Gen Media Suite
                </h1>
                <p className="mt-1 text-xs text-zinc-400 max-w-[280px]">
                  All platforms. Zero paywalls. Direct to device.
                </p>

                {/* 2x2 Bento Grid */}
                <div className="grid grid-cols-2 gap-2.5 w-full mt-4">
                  {slide1Features.map((f, i) => (
                    <div key={i} className="p-3 rounded-xl bg-white/[0.03] border border-white/[0.07] flex items-center gap-2.5 text-left">
                      <div className="w-8 h-8 shrink-0 rounded-lg bg-white/[0.06] border border-white/[0.08] flex items-center justify-center text-white">
                        <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                          <path d={f.icon} />
                        </svg>
                      </div>
                      <div className="min-w-0">
                        <p className="text-xs font-semibold text-zinc-100 truncate">{f.title}</p>
                        <p className="text-[10px] text-zinc-500 truncate">{f.sub}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* ── SLIDE 2: Universal Platforms ── */}
            {step === 2 && (
              <div className="flex flex-col items-center text-center animate-fadeIn">
                <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/[0.05] border border-white/[0.08] text-[10px] font-bold tracking-wider text-zinc-300 uppercase mb-2">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                  Universal Compatibility
                </div>

                <h1 className="text-xl sm:text-2xl font-bold tracking-tight text-white">
                  1,000+ Platforms Supported
                </h1>
                <p className="mt-1 text-xs text-zinc-400 max-w-[300px]">
                  Universal media extraction with zero watermark barriers.
                </p>

                {/* Platforms Grid */}
                <div className="grid grid-cols-2 gap-2.5 w-full mt-4">
                  {platforms.map((p, i) => (
                    <div key={i} className="p-2.5 rounded-xl bg-white/[0.03] border border-white/[0.07] flex items-center justify-between text-left">
                      <div className="flex items-center gap-2 min-w-0">
                        <div 
                          className="w-6 h-6 shrink-0 rounded-md flex items-center justify-center text-[9px] font-black"
                          style={{ backgroundColor: `${p.color}22`, color: p.color, border: `1px solid ${p.color}55` }}
                        >
                          {p.badge}
                        </div>
                        <span className="text-xs font-semibold text-zinc-100 truncate">{p.name}</span>
                      </div>
                      <span className="text-[9px] text-zinc-500 shrink-0 ml-1">{p.tag.split("•")[0]}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* ── SLIDE 3: Turbo Engine ── */}
            {step === 3 && (
              <div className="flex flex-col items-center text-center animate-fadeIn">
                <div className="w-14 h-14 rounded-2xl bg-white/[0.04] border border-white/[0.08] flex items-center justify-center text-white mb-3 shadow-lg">
                  <svg className="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
                  </svg>
                </div>

                <h1 className="text-xl sm:text-2xl font-bold tracking-tight text-white">
                  16x Multi-Thread Turbo
                </h1>
                <p className="mt-1 text-xs text-zinc-400 max-w-[300px]">
                  16-channel Aria2c acceleration with instant HTTP Range auto-resume.
                </p>

                {/* Linear Features List */}
                <div className="space-y-2.5 w-full mt-4 text-left">
                  {slide3Features.map((f, i) => (
                    <div key={i} className="p-3 rounded-xl bg-white/[0.03] border border-white/[0.07] flex items-center gap-3">
                      <div className="w-8 h-8 shrink-0 rounded-lg bg-white/[0.06] border border-white/[0.08] flex items-center justify-center text-zinc-100">
                        <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                          <path d={f.icon} />
                        </svg>
                      </div>
                      <div className="min-w-0">
                        <p className="text-xs font-semibold text-zinc-100 truncate">{f.title}</p>
                        <p className="text-[11px] text-zinc-400 leading-tight line-clamp-1">{f.sub}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* ── SLIDE 4: Studio Quality & PiP ── */}
            {step === 4 && (
              <div className="flex flex-col items-center text-center animate-fadeIn">
                <div className="w-14 h-14 rounded-2xl bg-white/[0.04] border border-white/[0.08] flex items-center justify-center text-white mb-3 shadow-lg">
                  <svg className="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <polygon points="5 3 19 12 5 21 5 3" />
                  </svg>
                </div>

                <h1 className="text-xl sm:text-2xl font-bold tracking-tight text-white">
                  Studio Quality & PiP
                </h1>
                <p className="mt-1 text-xs text-zinc-400 max-w-[300px]">
                  Ad-free streaming, 320kbps audio extraction, and floating PiP.
                </p>

                {/* Linear Features List */}
                <div className="space-y-2.5 w-full mt-4 text-left">
                  {slide4Features.map((f, i) => (
                    <div key={i} className="p-3 rounded-xl bg-white/[0.03] border border-white/[0.07] flex items-center gap-3">
                      <div className="w-8 h-8 shrink-0 rounded-lg bg-white/[0.06] border border-white/[0.08] flex items-center justify-center text-zinc-100">
                        <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                          <path d={f.icon} />
                        </svg>
                      </div>
                      <div className="min-w-0">
                        <p className="text-xs font-semibold text-zinc-100 truncate">{f.title}</p>
                        <p className="text-[11px] text-zinc-400 leading-tight line-clamp-1">{f.sub}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* Bottom Action Area (Always Fixed & Perfectly Visible) */}
          <div className="relative z-10 pt-2 space-y-3">
            {/* Expanding Spring Pagination Indicator */}
            <div className="flex items-center justify-center gap-1.5">
              {[1, 2, 3, 4].map((idx) => (
                <button
                  key={idx}
                  onClick={() => setStep(idx)}
                  className={`h-1.5 rounded-full transition-all duration-300 cursor-pointer ${
                    step === idx ? "w-6 bg-white" : "w-1.5 bg-zinc-700 hover:bg-zinc-500"
                  }`}
                />
              ))}
            </div>

            {/* Solid High-Contrast CTA Button */}
            <button
              id="cta-continue-btn"
              onClick={() => {
                if (step < 4) setStep(step + 1);
                else window.location.href = "/";
              }}
              className="w-full h-12 py-3 rounded-xl bg-white text-black font-semibold text-xs sm:text-sm flex items-center justify-center gap-2 active:scale-[0.98] transition cursor-pointer shadow-md shadow-white/5"
            >
              <span>{step === 4 ? "Get Started with Downloadivo" : "Continue"}</span>
              <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                {step === 4 ? (
                  <polyline points="20 6 9 17 4 12" />
                ) : (
                  <>
                    <line x1="5" y1="12" x2="19" y2="12" />
                    <polyline points="12 5 19 12 12 19" />
                  </>
                )}
              </svg>
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.render(<OnboardingApp />, document.getElementById("root"));
  </script>
</body>
</html>
