<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Downloadivo Onboarding — Studio Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Framer Motion -->
  <script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background-color: #060608;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .mobile-frame {
      width: 100%;
      max-width: 410px;
      min-height: 100vh;
      background: #060608;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    @media (min-width: 640px) {
      .mobile-frame {
        min-height: 844px;
        max-height: 880px;
        border-radius: 44px;
        border: 8px solid #18181b;
        overflow: hidden;
      }
    }
  </style>
</head>
<body>
  <div id="root" class="mobile-frame"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { motion, AnimatePresence } = window.Motion || window.framerMotion || { motion: { div: "div" } };

    // Lucide SVG Icons Components
    const InfinityIcon = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 12c-2-2.67-4-4-6-4a4 4 0 1 0 0 8c2 0 4-1.33 6-4Zm0 0c2 2.67 4 4 6 4a4 4 0 0 0 0-8c-2 0-4 1.33-6 4Z"/>
      </svg>
    );

    const ShieldCheckIcon = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
        <path d="m9 12 2 2 4-4"/>
      </svg>
    );

    const LockIcon = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    );

    const ZapIcon = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
    );

    const ArrowRightIcon = () => (
      <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M5 12h14"/>
        <path d="m12 5 7 7-7 7"/>
      </svg>
    );

    const features = [
      { icon: InfinityIcon, title: "100% Free", subtitle: "No Paywalls" },
      { icon: ShieldCheckIcon, title: "0 Watermarks", subtitle: "Pure Quality" },
      { icon: LockIcon, title: "100% Private", subtitle: "Device Direct" },
      { icon: ZapIcon, title: "Ultra Fast", subtitle: "Aria2c Multi-Thread" },
    ];

    function DownloadivoOnboarding() {
      const [step, setStep] = useState(1);

      return (
        <div className="relative h-full min-h-screen sm:min-h-[844px] bg-[#060608] text-white flex flex-col justify-between px-6 py-8 overflow-hidden select-none">
          {/* Subtle Ambient Background Mesh (Replaces tacky 3D) */}
          <div className="pointer-events-none absolute top-16 left-1/2 -translate-x-1/2 w-72 h-72 rounded-full bg-indigo-500/15 blur-[110px]" />

          {/* Top Bar */}
          <header className="relative z-10 flex items-center justify-between">
            <div className="flex items-center gap-2.5">
              <div className="w-7 h-7 rounded-lg bg-white text-black font-bold flex items-center justify-center text-sm shadow">
                D
              </div>
              <span className="font-semibold tracking-tight text-sm text-zinc-100">
                Downloadivo
              </span>
            </div>
            <div className="flex items-center gap-3">
              <span className="px-2.5 py-1 rounded-full text-xs font-medium bg-white/[0.06] border border-white/[0.08] text-zinc-400 tabular-nums">
                {step} / 4
              </span>
              <button 
                onClick={() => window.location.href = "/"}
                className="text-xs font-medium text-zinc-400 hover:text-white transition"
              >
                Skip
              </button>
            </div>
          </header>

          {/* Borderless 3D Flagship Hero Stage */}
          <div className="relative z-10 my-auto flex flex-col items-center text-center pt-2 pb-2">
            <div className="relative w-56 h-56 sm:w-64 sm:h-64 flex items-center justify-center mb-3">
              {/* Ambient radial glow behind the 3D core */}
              <div className="absolute inset-0 rounded-full bg-cyan-500/15 blur-[50px] pointer-events-none" />
              <div className="absolute inset-4 rounded-full bg-violet-500/15 blur-[60px] pointer-events-none" />
              
              {/* 3D Motion Loop Video */}
              <video
                autoPlay
                loop
                muted
                playsInline
                poster="/assets/intro_3d_render.jpg"
                className="w-full h-full object-contain rounded-3xl drop-shadow-[0_20px_35px_rgba(0,0,0,0.85)] filter contrast-[1.04]"
              >
                <source src="/assets/intro_3d.mp4" type="video/mp4" />
                <img src="/assets/intro_3d_render.jpg" alt="Downloadivo 3D Media Core" className="w-full h-full object-contain rounded-3xl" />
              </video>
            </div>

            <h1 className="text-2xl font-bold tracking-tight text-white max-w-xs leading-snug">
              The Next-Gen Media Suite
            </h1>
            <p className="mt-2 text-xs sm:text-sm text-zinc-400 max-w-[310px] leading-relaxed">
              Direct high-fidelity streaming, multi-platform media ingestion & conversion without paywalls.
            </p>
          </div>

          {/* Fixed 2x2 Bento Grid — Zero Awkward Line Wrapping */}
          <div className="relative z-10 space-y-6">
            <div className="grid grid-cols-2 gap-3">
              {features.map(({ icon: Icon, title, subtitle }, idx) => (
                <div
                  key={title}
                  className="p-3.5 rounded-2xl bg-white/[0.03] border border-white/[0.07] flex items-center gap-3"
                >
                  <div className="w-9 h-9 shrink-0 rounded-xl bg-white/[0.06] border border-white/[0.08] flex items-center justify-center text-zinc-200">
                    <Icon />
                  </div>
                  <div className="min-w-0">
                    <p className="text-xs font-semibold text-zinc-100 truncate">
                      {title}
                    </p>
                    <p className="text-[11px] text-zinc-500 truncate">
                      {subtitle}
                    </p>
                  </div>
                </div>
              ))}
            </div>

            {/* Pagination & Primary Button */}
            <div className="space-y-4">
              <div className="flex items-center justify-center gap-1.5">
                <span className={`h-1.5 rounded-full transition-all duration-300 ${step === 1 ? 'w-6 bg-white' : 'w-1.5 bg-zinc-700'}`} />
                <span className={`h-1.5 rounded-full transition-all duration-300 ${step === 2 ? 'w-6 bg-white' : 'w-1.5 bg-zinc-700'}`} />
                <span className={`h-1.5 rounded-full transition-all duration-300 ${step === 3 ? 'w-6 bg-white' : 'w-1.5 bg-zinc-700'}`} />
                <span className={`h-1.5 rounded-full transition-all duration-300 ${step === 4 ? 'w-6 bg-white' : 'w-1.5 bg-zinc-700'}`} />
              </div>

              <button
                onClick={() => {
                  if (step < 4) setStep(step + 1);
                  else window.location.href = "/";
                }}
                className="w-full h-13 py-3.5 rounded-2xl bg-white text-black font-semibold text-sm flex items-center justify-center gap-2 active:scale-[0.98] transition shadow-lg shadow-white/5 cursor-pointer"
              >
                <span>{step === 4 ? "Get Started with Downloadivo" : "Continue"}</span>
                <ArrowRightIcon />
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<DownloadivoOnboarding />, document.getElementById("root"));
  </script>
</body>
</html>
