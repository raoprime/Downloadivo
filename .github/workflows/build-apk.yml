name: 🚀 Build & Release Downloadivo Android APK

on:
  push:
    branches: [ main, android ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, android ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Rename APK for Release
        run: cp app/build/outputs/apk/debug/app-debug.apk Downloadivo-v1.0-universal.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Downloadivo-v1.0-universal.apk
          path: Downloadivo-v1.0-universal.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: Downloadivo-v1.0-universal.apk
          tag_name: ${{ github.ref_name }}
          name: Downloadivo Android ${{ github.ref_name }}
          body: |
            ## ⚡ Downloadivo Mobile Release
            - **Seal-Inspired Workflow:** 1-tap system share sheet integration
            - **Foreground Service:** 24/7 background download with live notification
            - **MediaStore Direct Sync:** Instant indexing into Google Photos / Gallery
            - **Line-rate Speed:** Multi-connection streaming proxy
          draft: false
          prerelease: false
